<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><title>defineCustomElement 스모크 테스트</title></head>
<body>
<table>
  <tbody id="diff-body">
    <tr data-line="5" data-type="B" id="line5"><td>diff line 5</td></tr>
  </tbody>
</table>

<div class="comment-thread-wrap" id="thread-1">
  <div class="write-comment-form"></div>
  <button type="button" data-thread-id="42" id="reply-btn">Reply</button>
</div>

<!-- 실제 common/reviewForm.html과 동일하게 서버 렌더링 시점에 data-* 속성으로 실제
     currentUser/action 데이터를 직접 심어둔다(configure()를 명시적으로 호출할 필요
     없이 onMounted가 host 자신의 속성에서 읽는 실제 프로덕션 경로를 그대로 재현). -->
<yona-review-form
  id="target"
  data-action="/reviews"
  data-avatar-url="/images/avatar.png"
  data-profile-url="/user/tester"
  data-resource-type="CODE_COMMENT_THREAD"
></yona-review-form>

<script type="module">
  import "../dist-element/yona-markdown-editor-vue-element.js";
  import "../dist-element/yona-attachments-element.js";
  import "../dist-element/yona-review-form-element.js";
</script>
</body>
</html>
