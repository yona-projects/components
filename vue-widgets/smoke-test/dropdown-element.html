<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><title>defineCustomElement 스모크 테스트</title></head>
<body>
<yona-dropdown id="target" class="btn-group" data-name="state">
  <button class="btn dropdown-toggle" data-toggle="dropdown" type="button">
    <span class="d-label">상태 선택</span>
    <span class="d-caret"><span class="caret"></span></span>
  </button>
  <ul class="dropdown-menu mass-update-list">

    <li data-value="CLOSED" data-selected="true"><a href="javascript:void(0);">닫힘</a></li>
  </ul>
</yona-dropdown>
<script type="module" src="../dist-element/yona-dropdown-element.js"></script>
